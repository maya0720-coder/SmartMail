# AI-Ground g-llm 채팅 화면 필드 매핑(AI-01, AI-05, 결정기록 0008).
# AI-Ground는 공식 API가 없어 사내 SSO로 로그인한 비저장 브라우저에서 채팅 화면을 자동화한다.
# 값이 비어 있으면 실제 자동화를 하지 않고 '확인 필요' 안내를 낸다(추측 구현 금지).
# 선택자는 Playwright CSS 선택자 형식이다. 경로(path)는 SMARTMAIL_AIGROUND_BASE_URL 뒤에 붙는다.

# 2026-11-12 실제 화면(G-LLM AI Ground)에서 확인한 값. 화면 개편 시 다시 확인한다(결정기록 0010).

[chat]
path = "/"                                          # 채팅 첫 화면
new_chat = "#historyNewChat"                        # '+ 새 대화' 버튼. 매 호출 새 대화로 시작
model = ""                                          # 비우면 화면 기본 모델 사용
model_option = ""                                   # model과 함께 사용
prompt = "#messageInput"                            # 메시지 입력칸(textarea)
submit = "#chatForm button.send"                    # 전송(›) 버튼
answer = "article.message.assistant .chat-text"     # 답변 본문(복사 버튼 글자 제외)
busy = ""                                           # 생성 중 표시 요소 없음(완료 표시로 판단)
done = "article.message.assistant .message-meta"    # 답변 완료 후 나타나는 토큰·시간 정보
