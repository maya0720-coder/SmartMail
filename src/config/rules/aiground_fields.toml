# AI-Ground g-llm 채팅 화면 필드 매핑(AI-01, AI-05, 결정기록 0008).
# AI-Ground는 공식 API가 없어 사내 SSO로 로그인한 비저장 브라우저에서 채팅 화면을 자동화한다.
# 값이 비어 있으면 실제 자동화를 하지 않고 '확인 필요' 안내를 낸다(추측 구현 금지).
# 선택자는 Playwright CSS 선택자 형식이다. 경로(path)는 SMARTMAIL_AIGROUND_BASE_URL 뒤에 붙는다.

[chat]
path = ""        # 새 대화 화면 경로(확인 필요). 매 호출마다 이 경로로 이동해 새 대화로 시작한다
new_chat = ""    # 새 대화 버튼 선택자(선택). 경로 이동만으로 새 대화가 열리지 않을 때 사용
model = ""       # g-llm 모델 선택 요소 선택자(선택, 확인 필요). 비우면 화면 기본 모델 사용
model_option = "" # 모델 목록에서 g-llm 항목 선택자(선택, model과 함께 사용)
prompt = ""      # 질문 입력칸 선택자(확인 필요)
submit = ""      # 보내기 버튼 선택자(선택). 비우면 입력칸에서 Enter
answer = ""      # 답변 말풍선 선택자(확인 필요). 여러 개면 마지막 것을 읽는다
busy = ""        # 답변 생성 중에만 보이는 요소(예: 중지 버튼) 선택자(선택)
done = ""        # 답변이 끝나면 나타나는 요소(예: 복사 버튼) 선택자(선택)
