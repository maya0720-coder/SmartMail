# G-Knowledge 화면 필드 매핑(GK-03, SRCH-02, 결정기록 0008).
# 공식 API가 없어 사내 SSO로 로그인한 비저장 브라우저에서 화면을 자동화한다.
# 값이 비어 있으면 실제 자동화를 하지 않고 '확인 필요' 안내를 낸다(추측 구현 금지).
# 선택자는 Playwright CSS 선택자 형식이다. 경로(path)는 SMARTMAIL_GKNOWLEDGE_BASE_URL 뒤에 붙는다.
# 선택자는 자주 바뀌지 않는 id·name 속성을 우선 쓴다(예: "#title", "[name='subject']").

[register]
# 등록 화면은 2단계다(2026-11-12 실제 화면 확인, 결정기록 0010·0032):
#   1) 작성: 제목·본문 입력 → 'AI 분석'(analyze)
#   2) 확인: AI 분석 결과 칸이 나타나면(analysis_ready) → '등록요청'(submit)
# AI 분석 결과 칸(#c-title·#c-summary·#c-content 등)은 G-Knowledge가 채운 그대로 둔다.
# 2026-11-16 작성 화면 재확인(사용자 화면 캡처): 제목은 '(선택)', 내용은 Quill 편집기, 첨부(선택, 20MB),
#   'AI 분석' 버튼 순서가 위 설정과 같다. 안내 문구상 마지막 단계는 '등록 요청'이다(즉시 게시 여부 확인 필요).
path = "/knowledge/new"   # 기획서 확인값(등록 화면 경로)
title = "#title"          # 제목 입력칸(0010 확인)
body = ".ql-editor"       # 본문: Quill 편집기(contenteditable, 0010 확인)
tags = ""                 # 태그 입력칸 선택자. 화면에 태그 칸이 없으므로 비워 둔다(태그는 내용 끝에 붙임)
analyze = "#analyze-btn"  # 'AI 분석' 버튼(0010 확인). 비우면 1단계 화면으로 동작
analysis_ready = "#c-title"  # 분석 결과 제목 칸이 보이고 글자가 들어오면 분석 완료로 본다(0010·0032)
submit = "#confirm-btn"   # '등록요청' 버튼(0010 확인)
# 등록 결과 확인 방법. 셋 중 하나는 반드시 채워야 등록이 동작한다(보안 검토 M-1).
# - result_message: 등록요청 뒤 나타나는 접수 안내 요소 선택자
# - result_link: 등록 후 지식 링크를 담은 요소 선택자
# - result_path: 등록 후 이동하는 지식 상세 주소의 경로 형식(정규식, 경로 전체 일치, 200자 이하)
#   예: "/knowledge/[0-9]+" — 로그인·오류·목록 화면으로 간 경우를 성공으로 오인하지 않게 한다.
# 확인하지 못하면 재전송하지 않고 사용자에게 직접 확인을 요청한다(중복 등록 방지).
# 2026-11-16 사용자 1건 등록 확인(결정기록 0032): '등록요청' 뒤 주소는 /knowledge/new 그대로이고
#   "등록 요청이 접수되었습니다. (REVIEW / Review)" 안내와 '새로 등록하기' 버튼만 나온다.
#   지식 상세 링크가 없어 result_link·result_path는 쓸 수 없고, 접수 안내 글자로 확인한다.
result_message = "text=등록 요청이 접수되었습니다"
result_link = ""
result_path = ""
# 첨부 칸은 자동화하지 않는다(메일 첨부를 저장·전송하지 않음).

[search]
# 검색 화면 경로. "{query}"를 넣으면 주소로 검색한다(권장, 예: "/search?q={query}").
# "{query}"가 없으면 아래 query·submit 선택자로 입력·검색한다.
path = ""                 # 확인 필요
query = ""                # 검색어 입력칸 선택자(주소 검색이면 비워도 됨)
submit = ""               # 검색 버튼 선택자(주소 검색이면 비워도 됨)
item = ""                 # 결과 항목 선택자(확인 필요)
item_title = ""           # 결과 항목 안의 제목 선택자(비우면 항목 전체 글자)
item_link = ""            # 결과 항목 안의 링크 선택자(확인 필요)
