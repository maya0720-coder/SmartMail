# G-Knowledge 화면 필드 매핑(GK-03, SRCH-02). 실제 화면 구조는 확인 필요다.
# 값이 비어 있으면 실제 자동화를 하지 않고 '확인 필요' 안내를 낸다(추측 구현 금지).
# 선택자는 Playwright CSS 선택자 형식이다. 경로(path)는 SMARTMAIL_GKNOWLEDGE_BASE_URL 뒤에 붙는다.

[register]
path = "/knowledge/new"   # 기획서 확인값: gk.golfzon.company/knowledge/new
title = ""                # 제목 입력칸 선택자(확인 필요)
body = ""                 # 본문 입력칸 선택자(확인 필요)
tags = ""                 # 태그 입력칸 선택자(확인 필요, 없으면 빈 값)
submit = ""               # 등록 버튼 선택자(확인 필요)
result_link = ""          # 등록 후 지식 링크를 담은 요소 선택자(확인 필요, 비우면 현재 주소 사용)

[search]
path = ""                 # 검색 화면 경로(확인 필요)
query = ""                # 검색어 입력칸 선택자(확인 필요)
submit = ""               # 검색 버튼 선택자(확인 필요)
item = ""                 # 결과 항목 선택자(확인 필요)
item_title = ""           # 결과 항목 안의 제목 선택자(확인 필요)
item_link = ""            # 결과 항목 안의 링크 선택자(확인 필요)
