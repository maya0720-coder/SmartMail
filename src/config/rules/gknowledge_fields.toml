# G-Knowledge 화면 필드 매핑(GK-03, SRCH-02, 결정기록 0008).
# 공식 API가 없어 사내 SSO로 로그인한 비저장 브라우저에서 화면을 자동화한다.
# 값이 비어 있으면 실제 자동화를 하지 않고 '확인 필요' 안내를 낸다(추측 구현 금지).
# 선택자는 Playwright CSS 선택자 형식이다. 경로(path)는 SMARTMAIL_GKNOWLEDGE_BASE_URL 뒤에 붙는다.
# 선택자는 자주 바뀌지 않는 id·name 속성을 우선 쓴다(예: "#title", "[name='subject']").

[register]
path = "/knowledge/new"   # 기획서 확인값(등록 화면 경로)
title = ""                # 제목 입력칸 선택자(확인 필요)
body = ""                 # 내용 입력칸 선택자(확인 필요)
tags = ""                 # 태그 입력칸 선택자. 화면에 태그 칸이 없으므로 비워 둔다(태그는 내용 끝에 붙임)
submit = ""               # 등록 버튼 선택자(확인 필요)
# 등록 결과 확인 방법. 둘 중 하나는 반드시 채워야 등록이 동작한다(보안 검토 M-1).
# - result_link: 등록 후 지식 링크를 담은 요소 선택자
# - result_path: 등록 후 이동하는 지식 상세 주소의 경로 형식(정규식, 경로 전체 일치, 200자 이하)
#   예: "/knowledge/[0-9]+" — 로그인·오류·목록 화면으로 간 경우를 성공으로 오인하지 않게 한다.
# 확인하지 못하면 재전송하지 않고 사용자에게 직접 확인을 요청한다(중복 등록 방지).
result_link = ""
result_path = ""          # 확인 필요
# 첨부 칸은 자동화하지 않는다(메일 첨부를 저장·전송하지 않음).

[search]
# 검색 화면 경로. "{query}"를 넣으면 주소로 검색한다(권장, 예: "/search?q={query}").
# "{query}"가 없으면 아래 query·submit 선택자로 입력·검색한다.
path = ""                 # 확인 필요
query = ""                # 검색어 입력칸 선택자(주소 검색이면 비워도 됨)
submit = ""               # 검색 버튼 선택자(주소 검색이면 비워도 됨)
item = ""                 # 결과 항목 선택자(확인 필요)
item_title = ""           # 결과 항목 안의 제목 선택자(비우면 항목 전체 글자)
item_link = ""            # 결과 항목 안의 링크 선택자(확인 필요)
