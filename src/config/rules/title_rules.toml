# 업무 제목 규칙(TODO-01, 결정기록 0015 · 점검 D1).
# AI 요청 요약이 아래 일반 문구만 남거나 min_chars보다 짧으면 요약을 버리고 메일 제목 정리본을 유지한다.
# 비교할 때는 공백·문장부호를 빼고, 요청 어미(드립니다 등)를 지운 뒤 본다.

min_chars = 8

generic_phrases = [
  "확인 부탁", "확인 요청", "확인 바랍니다", "검토 요청", "검토 부탁", "회신 부탁", "회신 요청",
  "문의드립니다", "문의", "요청드립니다", "부탁드립니다", "처리 부탁", "처리 요청", "참고 바랍니다",
  "공유드립니다", "전달드립니다", "업무 요청", "요청 사항", "협조 요청",
]

# 요청 어미: 이 말만 지워 보고 남는 내용이 없으면 일반 문구로 본다
polite_endings = ["드립니다", "드려요", "합니다", "바랍니다", "주세요", "주시기 바랍니다", "해주세요"]
