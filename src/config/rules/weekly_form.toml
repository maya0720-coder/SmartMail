# 주간보고 참고 링크 양식 머리글 -> 영역 매핑 키워드(WIKI-02, 결정기록 0024).
# 머리글(소문자 비교)에 키워드가 포함되면 해당 영역으로 본다. 판정 순서: issues -> planned -> done(첫 일치).
# 목록을 비우면 내장 기본값을 쓴다.

# 이슈·요청 사항
issues = ["이슈", "요청", "문제", "건의", "리스크", "risk", "blocker", "issue"]

# 차주 계획(예정)
planned = ["차주", "예정", "계획", "다음 주", "다음주", "next", "plan"]

# 금주 실적(완료·진행 중)
done = ["실적", "완료", "금주", "이번 주", "이번주", "진행", "done", "this week", "progress"]
