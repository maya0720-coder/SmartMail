# 사이트 자동 로그인 화면 선택자(AUTH-01·09, 결정기록 0011).
# 사용자가 앱 화면에 1회 입력한 ID·암호로 사이트 로그인 화면을 자동으로 채운다. 값은 저장하지 않는다.
# 선택자는 Playwright CSS 선택자. 화면이 바뀌면 이 파일만 고친다.
# concealed_input = 암호 입력칸(가려진 입력칸)의 선택자. 암호 값이 아니다.

# 회사 계정(Microsoft Entra ID) — AI-Ground·G-Knowledge 공통. 2026-11-12 화면 확인
[entra]
host = "login.microsoftonline.com"
account_domain = "golfzon.com"                         # 로그인 창에 입력한 ID 뒤에 붙인다(ID@golfzon.com)
# 이메일 화면에는 화면 밖에 숨긴 암호칸(aria-hidden)이, 암호 화면에는 숨긴 이메일칸이 함께 있다.
# Playwright는 이 칸도 '보임'으로 판정하므로 aria-hidden 칸을 제외한다(2026-11-13 확인).
email = "input[name='loginfmt']:not([aria-hidden='true'])"
concealed_input = "input[name='passwd']:not([aria-hidden='true'])"
next = "#idSIButton9"                                  # '다음'·'로그인' 공통 버튼
kmsi_marker = "#KmsiCheckboxField"                     # '로그인 상태 유지?' 화면 표시
kmsi_no = "#idBtn_Back"                                # 위 화면의 '아니요'(세션을 남기지 않음)
mfa_number = "#idRichContext_DisplaySign"              # Authenticator 번호 일치 화면의 번호
mfa_marker = "#idDiv_SAOTCAS_Title, #idDiv_SAOTCC_Title, #idDiv_SAOTCS_Title"  # 2단계 인증 화면
error = "#usernameError, #passwordError, #idTD_Error, #service_exception_message"
account_tile = "#tilesHolder [role='button'], #tilesHolder .table"   # 계정 선택 화면

# 로그인 완료 판정: 사이트 주소로 돌아와 아래 요소가 보이면 성공
[sites.ai-ground]
logged_in = "#messageInput"

[sites.g-knowledge]
logged_in = "a[href='/admin/logout']"

# 그룹웨어 자체 로그인 화면(/WebSite/Login.aspx). 2026-11-13 화면 구조 확인(계정 입력 없이)
# ID는 '@도메인' 없이 아이디만 넣는다. 암호칸은 자리표시 칸(concealed_placeholder)을 누르면 실제 칸으로 바뀐다.
# 로그인 버튼은 화면 없는 브라우저에서 눌리지 않아, 암호칸에서 Enter로 제출한다.
# 로그인 완료 판정(실제 로그인으로 확인 필요): 같은 사이트에서 주소 경로에 login_path_marker가 없어지면 성공.
[groupware]
user = "#txtPC_LoginID"
concealed_placeholder = "#txtPC_LoginPWTemp"
concealed_input = "#txtPC_LoginPW"
# 추가 인증(인증문자) 입력칸. 보이면 앱 화면에서 사용자에게 번호를 받아 넣고 Enter로 제출한다.
# 실제 인증문자 화면에서 동작 확인 필요(제출 방식·오류 표시). 결정기록 0020
# id·name에 otp가 들어간 '보이는' 입력칸(같은 이름의 숨은 모바일용 칸이 먼저 잡히지 않게 :visible).
otp_input = "input[id*='otp' i]:not([type='hidden']):visible, input[name*='otp' i]:not([type='hidden']):visible"
login_path_marker = "login"
# 보안문자(CAPTCHA, 결정기록 0025). 아래 선택자는 일반적인 이름 기반 추정값이다 — 실제 화면 확인 필요.
# 이미지는 로그인 중인 같은 브라우저 화면에서 캡처해 앱 로그인 창에 보여 준다(별도 요청으로 다시 받지 않음).
captcha_image = "img[id*='captcha' i]:visible, img[src*='captcha' i]:visible, img[alt*='보안문자']:visible, img[alt*='captcha' i]:visible"
captcha_input = "input[id*='captcha' i]:not([type='hidden']):visible, input[name*='captcha' i]:not([type='hidden']):visible, input[placeholder*='보안문자']:visible"
# 새 이미지 요청 버튼(없으면 앱의 '새 이미지' 버튼은 동작하지 않고 실패 처리)
captcha_refresh = "a[id*='captcha' i]:visible, button[id*='captcha' i]:visible, [onclick*='refresh' i][id*='captcha' i]:visible, [title*='새로고침']:visible, [alt*='새로고침']:visible"
# 입력칸에서 Enter 제출이 먹지 않을 때 누르는 로그인 버튼(실제 화면 확인 필요)
submit = "input[type='submit']:visible, button[type='submit']:visible, a[id*='login' i][id*='btn' i]:visible, input[id*='btn' i][id*='login' i]:visible"
# 화면에 표시되는 오류 문구 영역(범주 분류에만 쓰고 글자는 기록하지 않음. 실제 화면 확인 필요)
error_area = "[id*='error' i]:visible, [id*='msg' i]:visible, [class*='error' i]:visible, [class*='alert' i]:visible"
# 입력값 처리: 대소문자 keep(그대로)|upper|lower, 길이 범위(영문·숫자), 보안문자 때문에 폼을 다시 제출하는 최대 횟수(1~3, 계정 잠금 방지로 낮게)
captcha_case = "keep"
captcha_length = "4-8"
captcha_max_tries = "2"

# 위키(Confluence Data Center) 자체 로그인 화면. 2026-11-12 화면 확인
[wiki]
path = "/login.action"
user = "#username-field"
concealed_input = "#password-field"
submit = "#login-button"
error = ".aui-message-error, .aui-message.error"
# 로그인 확인용 API: type이 known이면 로그인됨
current_user_api = "/rest/api/user/current"
