<!-- 시작 로그인 창(AUTH-01·04·09, 결정기록 0014): ID 1개 + 공통 암호로 연결 사이트에 한 번에 로그인.
     자동완성·암호 저장 제안 끔, '로그인 상태 유지' 없음. 입력값은 전송 직후 비운다. -->
<div class="dim" id="dlg-start" role="dialog" aria-modal="true" aria-labelledby="st-title" aria-describedby="st-sub">
  <div class="modal login-modal">
    <div class="lm-head">
      <span class="lm-logo"><svg class="ic" aria-hidden="true"><use href="{{ ic }}layout-grid"></use></svg></span>
      <div>
        <h3 id="st-title">업무 처리 현황 시작하기</h3>
        <p class="s" id="st-sub">회사 계정으로 연결 사이트에 한 번에 로그인합니다.</p>
      </div>
    </div>
    <ul class="lm-sites" id="st-sites" aria-label="로그인할 사이트"></ul>
    <!-- 필요할 때 로그인(결정기록 0034): 이번 작업에 필요 없는 미로그인 사이트도 함께 로그인할지 -->
    <label class="lm-also hidden" id="st-also-row"><input type="checkbox" id="st-also" checked> 아직 로그인 안 된 다른 사이트도 함께 로그인</label>
    <form id="st-form" autocomplete="off">
      <div class="field">
        <label for="st-id">아이디</label>
        <div class="id-wrap">
          <input id="st-id" name="x-id" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="100" required aria-describedby="st-id-hint">
          <span class="id-suffix" id="st-suffix">@golfzon.com</span>
        </div>
        <p class="hint" id="st-id-hint">AI-Ground·G-Knowledge는 <b>아이디<span id="st-domain">@golfzon.com</span></b>, 위키는 <b>아이디</b>만으로 로그인합니다. 그룹웨어는 필요할 때 설정·연결에서 따로 로그인합니다.</p>
      </div>
      <div class="field">
        <label for="st-pw">암호</label>
        <input id="st-pw" type="password" name="x-pw" autocomplete="new-password" maxlength="256" required>
      </div>
      <details class="lm-more" id="st-more">
        <summary>위키 암호가 다른가요?</summary>
        <div class="field">
          <label for="st-wpw">위키 암호</label>
          <input id="st-wpw" type="password" name="x-wpw" autocomplete="new-password" maxlength="256">
        </div>
      </details>
      <p class="mfa" id="st-mfa" aria-live="polite"></p>
      <!-- 그룹웨어 인증문자(결정기록 0020): 로그인 중 요청이 오면 보인다. 번호는 전송 직후 지운다. -->
      <div class="otp hidden" id="st-otp">
        <label for="st-otp-code" id="st-otp-msg">그룹웨어 인증문자로 받은 번호를 입력해 주세요.</label>
        <div class="otp-row">
          <input id="st-otp-code" name="x-otp" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" maxlength="12">
          <button type="button" class="btn primary" id="st-otp-ok">확인</button>
          <button type="button" class="btn" id="st-otp-cancel">취소</button>
        </div>
      </div>
      <!-- 그룹웨어 보안문자(결정기록 0025): 로그인 중인 같은 화면에서 캡처한 이미지(서버가 만든 data URL만).
           값은 전송 직후 지운다. -->
      <div class="otp captcha hidden" id="st-captcha">
        <label for="st-captcha-code" id="st-captcha-msg">그룹웨어 보안문자를 입력해 주세요.</label>
        <div class="captcha-img">
          <img id="st-captcha-img" alt="그룹웨어 보안문자 이미지" width="200" height="60">
          <button type="button" class="btn" id="st-captcha-refresh">새 이미지</button>
        </div>
        <div class="otp-row">
          <input id="st-captcha-code" name="x-captcha" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
          <button type="button" class="btn primary" id="st-captcha-ok">확인</button>
          <button type="button" class="btn" id="st-captcha-cancel">취소</button>
        </div>
      </div>
      <p class="err" id="st-err" role="alert"></p>
      <div class="m-actions">
        <button type="button" class="btn" id="st-later">닫기</button>
        <button class="btn primary" id="st-submit"><svg class="ic" aria-hidden="true"><use href="{{ ic }}log-out"></use></svg><span>로그인</span></button>
      </div>
      <p class="lm-note">입력한 아이디·암호는 로그인에 한 번만 쓰고 바로 지웁니다. 파일·로그·브라우저 어디에도 저장하지 않으며, '로그인 상태 유지'는 쓰지 않습니다.</p>
    </form>
  </div>
</div>
