<!-- 로그인 창(AUTH-01, AUTH-04): 자동완성·저장 체크박스 없음 -->
<div class="dim" id="dlg-login" role="dialog" aria-modal="true" aria-labelledby="lg-title">
  <div class="modal">
    <h3 id="lg-title">로그인</h3>
    <p class="s" id="lg-sub"></p>
    <div class="notice">입력한 ID·암호는 이번 로그인에만 쓰고 바로 지웁니다. 파일·로그·브라우저 어디에도 저장하지 않으며, 자동 로그인 기능은 없습니다.</div>
    <p class="err" id="lg-err"></p>
    <form id="lg-form" autocomplete="off">
      <div class="field"><label for="lg-id">ID</label><input id="lg-id" name="x-id" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="100"></div>
      <div class="field"><label for="lg-pw">암호</label><input id="lg-pw" type="password" name="x-pw" autocomplete="new-password" maxlength="256"></div>
      <div class="m-actions"><button type="button" class="btn" id="lg-cancel">취소</button><button class="btn primary" id="lg-submit">로그인</button></div>
    </form>
  </div>
</div>
