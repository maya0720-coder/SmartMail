{% extends "base.html" %}
{% block content %}
<h2>제안된 업무</h2>
<p class="desc">메일에서 추출한 업무 후보입니다. 승인해야 할 일 목록에 들어갑니다. 근거 문장은 이번 실행 중에만 보여주고 저장하지 않습니다.</p>
<div class="sum-bar" id="sum-bar" aria-live="polite">
  <svg class="ic" aria-hidden="true"><use href="{{ asset('img/icons.svg') }}#i-sparkles"></use></svg>
  <span id="sum-text">요청 요약 상태 확인 중</span>
  <button class="btn sm ai" id="sum-run" type="button">AI로 일괄 요약</button>
</div>
<div class="card">
  <table>
    <thead><tr><th>요청 사항 · 구분</th><th>근거 문장</th><th>기한</th><th></th></tr></thead>
    <tbody id="sugg"></tbody>
  </table>
  <div class="actions"><button class="btn sm" id="btn-collect">메일 새로고침</button><button class="btn sm" id="btn-approve-all">모두 승인</button></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ asset('js/suggestions.js') }}"></script>{% endblock %}
