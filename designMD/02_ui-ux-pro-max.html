<script>

const SEED=[["Notes 검토 요청의 건","MM","-"],["Notes 검토 요청","Basis","-"],["전표유형별 현황 확인 요청","FI","재무팀"],["예산관리 개선 협의","FI","-"],["신규 입사자 공유의 건","HR","인사팀"],["시스템 카피 일정 확인 요청","Basis","-"],["SAP 지출결의서 오류 확인 요청","FI","-"],["자산명세서 수정 요청의 건","FI","IE팀"],["예산과목 개선의 건","CO","-"],["중간관리수수료 인터페이스 회계정의서","FI","IT인프라팀"],["공간기획비 금액 산출 적용 검토","CO","경영기획팀"],["구매오더 승인 워크플로 변경","MM","구매팀"],["Fiori 타일 권한 추가 요청","Basis","IE팀"],["매출 인보이스 출력 양식 수정","SD","영업지원팀"]];

/* ---------- 공통 목록·페이징 컨트롤러 ---------- */
function makeList(root,skin){
  const st={filter:"all",page:1,per:8,sel:2};

  bulk.innerHTML=`<span>${sel.size}건 선택</span><button type="button" class="p" data-b="prog">진행 시작</button><button type="button" data-b="cand">완료 후보로</button><button type="button" data-b="clear">선택 해제</button>`; bulk.classList.toggle("on",sel.size>0);
  if(!A.data().length) list.innerHTML='<div class="fx-empty">검색 결과가 없어요 · Esc로 지우기</div>'; }
list.addEventListener("click",e=>{ const c=e.target.closest(".cb"); if(!c) return; e.stopPropagation(); const id=+c.closest(".row").dataset.id; sel.has(id)?sel.delete(id):sel.add(id); paint(); },true);
head.addEventListener("click",()=>{ const p=ids(), all=p.every(i=>sel.has(i)); p.forEach(i=>all?sel.delete(i):sel.add(i)); paint(); });
bulk.addEventListener("click",e=>{ const b=e.target.closest("[data-b]"); if(!b) return; const k=b.dataset.b;
  if(k==="clear"){ sel.clear(); return paint(); } const n=sel.size, prev=[...sel].map(i=>[i,TASKS.find(t=>t.id===i).st]);
  sel.forEach(i=>TASKS.find(t=>t.id===i).st=k); sel.clear(); A.renderChips(); A.render(); A.renderDet();
  FX.toast(`${n}건을 ‘${SL[k]}’(으)로 바꿨어요`,{action:"되돌리기",onAction:()=>{ prev.forEach(([i,s])=>TASKS.find(t=>t.id===i).st=s); A.renderChips(); A.render(); A.renderDet(); }}); });
window.addEventListener("list:render",paint); paint();
FX.onStatus=(t,p,n)=>FX.toast(`‘${SL[n]}’(으)로 변경됨`,{action:"되돌리기",onAction:()=>FX.setStatus(t.id,p)});

})();
</script>
</body>
