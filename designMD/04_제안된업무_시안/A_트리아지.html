 document.getElementById('pt').textContent=`오늘 정리 ${done} / ${total}`;document.getElementById('pb').style.width=(done/total*100)+'%';
 document.querySelectorAll('#tabs button').forEach(b=>{const k=b.dataset.f,n=items.filter(t=>k==='all'||(k==='low'?t.conf<.7:t.cat===k)).length;b.textContent=b.textContent.replace(/\s\d+$/,'')+' '+n;});}
function renderPane(){const t=items.find(x=>x.id===sel),p=document.getElementById('pane');
 if(!t){p.innerHTML='<div class="empty">제안을 선택하세요</div>';return;}
 p.innerHTML=`<div class="b">
  <div><div class="ttl"><input id="ti" value="${esc(t.title)}" aria-label="업무 제목">${conf(t.conf)}</div><div class="orig">${ic('mail')} 원래 메일 제목: ${esc(t.subject)}</div></div>
  <div class="fields"><div class="f"><label>구분</label><select><option ${t.cat==='일반업무'?'selected':''}>일반업무</option><option ${t.cat==='전자결재'?'selected':''}>전자결재</option></select></div>
   <div class="f"><label>기한</label><input value="${t.due||''}" placeholder="없음"></div><div class="f"><label>요청자</label><input value="${esc(t.from)}"></div>
   <div class="f"><label>주간보고 예상 위치</label><select><option>${t.week||'넣지 않음'}</option><option>금주 실적</option><option>차주 계획</option><option>이슈</option></select></div></div>
  <div><div class="sec">${ic('spark')} 왜 제안됐나요</div><div class="why">${t.reasons.map(r=>`<span class="chip ai">${esc(r)}</span>`).join('')}</div></div>
  <div><div class="sec">${ic('mail')} 메일에서 찾은 요청 문장</div><div class="mailbox"><div class="h"><span>${esc(t.from)} · ${t.recv}</span><span>원본은 아웃룩에서 다시 읽어 표시(저장 안 함)</span></div>${t.body.map(hl).join('<br>')}</div></div>
  ${t.similar.length?`<div><div class="sec">${ic('hist')} 비슷한 지난 업무</div><div class="sim">${t.similar.map(s=>`<div>${ic('link')}${esc(s)}</div>`).join('')}</div></div>`:''}
 </div>
 <div class="act">
  <button class="btn p" data-a="ok">${ic('check')}할 일로 <span class="kbd">A</span></button>
  <button class="btn" data-a="later">${ic('clock')}나중에 <span class="kbd">S</span></button>
  <button class="btn ghost" data-a="no">${ic('x')}업무 아님 <span class="kbd">D</span></button>
  ${t.cat==='전자결재'?`<button class="btn ghost">${ic('stamp')}결재함 열기</button>`:''}
  <span class="sp hint">${items.length-1>0?'처리하면 다음 제안으로 넘어갑니다':''}</span></div>`;
 p.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));}
function act(a){const L=vis(),i=L.findIndex(x=>x.id===sel),t=L[i];if(!t)return;
 const row=document.querySelector(`.it[data-id="${t.id}"]`);if(row)row.classList.add('out');
 setTimeout(()=>{const idx=items.indexOf(t);items.splice(idx,1);done++;const nx=vis()[Math.min(i,vis().length-1)];sel=nx?nx.id:null;renderList();renderPane();
  const msg={ok:'할 일 목록에 넣었어요',later:'내일 아침 다시 보여드릴게요',no:'업무 아님으로 분류했어요 · 비슷한 메일은 다음부터 덜 제안해요'}[a];
  toast(`‘${t.title}’ · ${msg}`,()=>{items.splice(idx,0,t);done--;sel=t.id;renderList();renderPane();});},220);}
document.getElementById('list').onclick=e=>{const r=e.target.closest('.it');if(!r)return;sel=+r.dataset.id;renderList();renderPane();};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));const L=vis();sel=L[0]?L[0].id:null;renderList();renderPane();};
document.addEventListener('keydown',e=>{if(e.target.closest('input,select'))return;const L=vis(),i=L.findIndex(x=>x.id===sel);
 if(e.key==='ArrowDown'&&i<L.length-1){sel=L[i+1].id;renderList();renderPane();e.preventDefault();}
 else if(e.key==='ArrowUp'&&i>0){sel=L[i-1].id;renderList();renderPane();e.preventDefault();}
 else if(e.key==='a'||e.key==='A')act('ok');else if(e.key==='s'||e.key==='S')act('later');else if(e.key==='d'||e.key==='D')act('no');
 else if(e.key==='e'||e.key==='E'){e.preventDefault();document.getElementById('ti')?.select();}});
renderList();renderPane();
</script></body></html>
