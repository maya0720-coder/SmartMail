 if(pos>=q.length){d.innerHTML=`<div class="done card top" style="justify-content:center"><h3>오늘 제안을 모두 정리했어요</h3><div>할 일 ${res.ok} · 나중에 ${res.later} · 업무 아님 ${res.no}</div><button class="btn p">대시보드로 가기</button></div>`;document.getElementById('btns').style.visibility='hidden';}
 else d.innerHTML=[2,1,0].map(k=>q[pos+k]?cardHTML(q[pos+k],k===0?'top':'back'+k,pos+k):'').join('');
 document.getElementById('stat').innerHTML=`<span>${ic('check')} 할 일로</span><b>${res.ok}</b><span>${ic('clock')} 나중에</span><b>${res.later}</b><span>${ic('x')} 업무 아님</span><b>${res.no}</b><span>남음</span><b>${q.length-pos}</b>`;
 document.getElementById('queue').innerHTML=q.map((t,i)=>`<div class="${i===pos?'now':i<pos?'gone':''}">${esc(t.title)}</div>`).join('');
 document.getElementById('avg').textContent=times.length?(times.reduce((a,b)=>a+b,0)/times.length/1000).toFixed(1)+'초':'-';
 bindDrag();}
function decide(a){if(pos>=q.length)return;const c=document.querySelector('.card.top');const t=q[pos];
 const tx={ok:'translateX(130%) rotate(12deg)',no:'translateX(-130%) rotate(-12deg)',later:'translateY(120%)'}[a];
 c.style.transform=tx;c.style.opacity=0;times.push(Date.now()-t0);t0=Date.now();
 setTimeout(()=>{res[a]++;pos++;render();toast(`‘${t.title}’ · ${{ok:'할 일로',later:'나중에',no:'업무 아님'}[a]}`,()=>{pos--;res[a]--;render();});},260);}
function bindDrag(){const c=document.querySelector('.card.top[data-i]');if(!c)return;let sx,sy,dx=0,dy=0;
 c.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.classList.add('drag');};
 c.onpointermove=e=>{if(sx==null)return;dx=e.clientX-sx;dy=e.clientY-sy;c.style.transform=`translate(${dx}px,${Math.max(0,dy)}px) rotate(${dx/20}deg)`;
  c.querySelector('.stampx.ok').style.opacity=Math.max(0,dx/120);c.querySelector('.stampx.no').style.opacity=Math.max(0,-dx/120);c.querySelector('.stampx.later').style.opacity=Math.max(0,(dy-Math.abs(dx))/120);};
 c.onpointerup=()=>{c.classList.remove('drag');const a=dx>110?'ok':dx<-110?'no':dy>110?'later':null;sx=null;
  if(a)decide(a);else{c.style.transform='';c.querySelectorAll('.stampx').forEach(s=>s.style.opacity=0);}dx=dy=0;};}
document.getElementById('btns').onclick=e=>{const b=e.target.closest('[data-a]');if(b)decide(b.dataset.a);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')decide('ok');else if(e.key==='ArrowLeft')decide('no');else if(e.key==='ArrowDown'){e.preventDefault();decide('later');}});
render();
</script></body></html>
