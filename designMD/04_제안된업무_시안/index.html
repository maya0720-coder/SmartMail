<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제안된 업무 컨셉 비교</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--soft:#f1f5f9;--line:#e2e8f0;--fg:#0f172a;--sub:#475569;--muted:#94a3b8;
--accent:#2563eb;--accent-soft:#eff6ff;--cta:#f97316;--warn:#d97706;--warn-soft:#fffbeb;--danger:#dc2626;--danger-soft:#fef2f2;
--ok:#16a34a;--ok-soft:#f0fdf4;--ai:#7c5cfa;--ai-soft:#f2eeff;--appr:#0aa2a8;--appr-soft:#e6f7f8;
--font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"Fira Code",Consolas,monospace;
--e:cubic-bezier(.23,1,.32,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111827;--soft:#1e293b;--line:#273449;--fg:#e2e8f0;--sub:#94a3b8;--muted:#64748b;
--accent:#3b82f6;--accent-soft:#172554;--warn:#f59e0b;--warn-soft:#2a1f0a;--danger:#f87171;--danger-soft:#2c1215;--ok:#4ade80;--ok-soft:#0f2a1a;--ai-soft:#2a2340;--appr-soft:#13302f;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:13px;line-height:1.5;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.top{display:flex;align-items:center;gap:12px;margin:12px 12px 0;padding:8px 12px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px}
@media (prefers-color-scheme:dark){.top{background:rgba(17,24,39,.85)}}
.top b{font-size:14px}.top nav{display:flex;gap:2px;margin-left:8px}.top nav a{padding:6px 10px;border-radius:8px;color:var(--sub);text-decoration:none;font-weight:600}
.top nav a.on{background:var(--accent-soft);color:var(--accent)}.top .demo{margin-left:auto;font-size:11px;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:999px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600;transition:background-color .2s,transform .12s var(--e)}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.p:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.kbd{font-family:var(--mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--card)}
.btn.p .kbd{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--sub);white-space:nowrap}
.chip.appr{background:var(--appr-soft);color:var(--appr)}.chip.due{background:var(--warn-soft);color:var(--warn)}.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}.chip.ok{background:var(--ok-soft);color:var(--ok)}
.conf{display:inline-flex;gap:2px;align-items:center}.conf i{width:5px;height:10px;border-radius:2px;background:var(--line)}.conf i.on{background:var(--accent)}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 2px}
@media (prefers-color-scheme:dark){mark{background:#854d0e;color:#fff}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;background:#0f172a;color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;display:flex;gap:12px;align-items:center;transition:all .3s var(--e);pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{border:0;background:none;color:#93c5fd;font-weight:700;padding:0}
.hint{font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.page{max-width:1500px;margin:0 auto;padding:24px}.page h1{margin:0;font-size:24px}.page>p{color:var(--sub);margin:6px 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.info div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.info b{display:block;margin-bottom:4px}
.frame{height:760px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}.frame iframe{width:100%;height:100%;border:0}
.rec{font-size:11px;font-weight:800;color:#fff;background:var(--ok);border-radius:999px;padding:1px 7px;margin-left:6px}
</style></head><body><div class="page"><h1>제안된 업무 — 컨셉 시안 3종</h1><p>모든 데이터는 가상입니다. 시안 안을 클릭한 뒤 키보드도 써 보세요.</p>
<div class="tabs" id="tabs"></div><div class="info" id="info"></div><div class="frame"><iframe id="fr" title="시안"></iframe></div></div>
<script>
const S=[{f:'A_트리아지.html',n:'A. 트리아지(받은편지함형)',rec:true,who:'매일 10~30건을 정리하는 기본 화면',how:'왼쪽 목록 + 오른쪽 근거 메일(요청 문장 하이라이트). A/S/D 키로 할 일·나중에·업무 아님',why:'기획서 “추출 근거(문장 하이라이트)”와 가장 가깝고, 양이 많아도 빠름'},
{f:'B_포커스카드.html',n:'B. 포커스 카드(한 장씩 결정)',who:'아침 첫 정리·모바일·건수 적을 때',how:'카드 한 장씩, 끌어서(→할 일 ←아님 ↓나중에) 결정',why:'결정 피로가 적고 재미있음. 많은 양에는 느림 → A의 ‘빠른 정리 모드’로 권장'},
{f:'C_분류보드.html',n:'C. 분류 보드(주간보고 연결형)',who:'주간보고 작성 전 한 주를 한눈에 정리',how:'정리 전 → 이번 주(금주 실적·차주 계획·이슈) / 나중에 / 업무 아님 칸으로 끌기',why:'승인 순간 주간보고 칸이 정해져 목적(주간보고 자동화)과 바로 연결. 끌기 조작 부담'}];
const tabs=document.getElementById('tabs');tabs.innerHTML=S.map((s,i)=>`<button data-i="${i}">${s.n}${s.rec?'<span class="rec">추천</span>':''}</button>`).join('');
function show(i){const s=S[i];tabs.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',i===j));document.getElementById('fr').src=s.f;
 document.getElementById('info').innerHTML=`<div><b>누구·언제</b>${s.who}</div><div><b>조작</b>${s.how}</div><div><b>장단점</b>${s.why}</div>`;}
tabs.onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.i)};show(0);
</script></body></html>
