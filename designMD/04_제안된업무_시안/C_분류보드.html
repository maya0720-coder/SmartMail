const COLS=[{k:'inbox',t:'정리 전',d:'메일에서 찾은 요청',i:'mail'},{k:'week',t:'이번 주 할 일',d:'승인 → 대시보드·주간보고에 반영',i:'check'},{k:'later',t:'나중에',d:'다음 주 월요일 다시 제안',i:'clock'},{k:'no',t:'업무 아님',d:'비슷한 메일은 덜 제안',i:'x'}];

function cardHTML(t){return `<div class="c ${t.cat==='전자결재'?'appr':''}" draggable="true" data-id="${t.id}" tabindex="0"><div class="t">${esc(t.title)}</div>

 <div class="qa">${COLS.filter(c=>c.k!==t.col).map(c=>`<button data-to="${c.k}">${c.t}</button>`).join('')}</div></div>`;}
function render(){const wk=document.getElementById('wkmode').checked;
 document.getElementById('board').innerHTML=COLS.map(c=>{const L=cards.filter(t=>t.col===c.k);let inner;
  if(c.k==='week'&&wk){inner=['금주 실적','차주 계획','이슈'].map(s=>{const S=L.filter(t=>(t.week||'금주 실적')===s);return `<div class="sub">${ic('report')} ${s} · ${S.length}</div>`+S.map(cardHTML).join('');}).join('');}
  else if(c.k==='inbox'){const ap=L.filter(t=>t.cat==='전자결재'),gn=L.filter(t=>t.cat!=='전자결재');inner=gn.map(cardHTML).join('')+(ap.length?`<div class="sub">${ic('stamp')} 전자결재 · ${ap.length}</div>`+ap.map(cardHTML).join(''):'');}
  else inner=L.map(cardHTML).join('');
  return `<section class="col" data-col="${c.k}"><h3>${ic(c.i)}${c.t}<span class="n">${L.length}</span></h3><div class="d">${c.d}</div><div class="cards">${inner||'<div class="hint" style="padding:8px">여기로 끌어 놓으세요</div>'}</div></section>`;}).join('');}
function move(id,to){const t=cards.find(x=>x.id===id);if(!t||t.col===to)return;const from=t.col;t.col=to;render();
 toast(`‘${t.title}’ → ${COLS.find(c=>c.k===to).t}`,()=>{t.col=from;render();});}
const B=document.getElementById('board');
B.addEventListener('dragstart',e=>{const c=e.target.closest('.c');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging');});
B.addEventListener('dragend',e=>{e.target.closest('.c')?.classList.remove('dragging');document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));});
B.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(!c)return;e.preventDefault();document.querySelectorAll('.col').forEach(x=>x.classList.toggle('over',x===c));});
B.addEventListener('drop',e=>{const c=e.target.closest('.col');if(!c)return;e.preventDefault();move(+e.dataTransfer.getData('text/plain'),c.dataset.col);});
B.addEventListener('click',e=>{const b=e.target.closest('[data-to]');if(!b)return;move(+b.closest('.c').dataset.id,b.dataset.to);});
document.getElementById('wkmode').onchange=render;render();
</script></body></html>
