<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartMail 검토 · 진행 여부 체크</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--sub:#5b6475;--line:#e3e6ec;--pri:#2f5bea;--ok:#1f9d55;--hold:#d98a00;--no:#9aa3b2;--chip:#eef2ff}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{background:#1d2433;color:#fff;padding:18px 24px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:#c6ccd8;font-size:13px}
.warn{background:#fff7e6;border:1px solid #f3d08a;color:#6b4a00;border-radius:10px;padding:10px 14px;margin:14px 24px 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs button,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.main{background:var(--pri);color:#fff;border-color:var(--pri)}
.stat{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.stat span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px}
main{padding:16px 24px 60px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;border-left:5px solid var(--line)}
.card.s-go{border-left-color:var(--ok)}.card.s-hold{border-left-color:var(--hold)}.card.s-no{border-left-color:var(--no);opacity:.7}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.id{font-weight:700;font-size:12px;color:var(--pri)}.chip{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11px;color:#34407a}
.chip.p1{background:#ffe8e8;color:#a32020}.chip.p2{background:#fff2d9;color:#8a5a00}.chip.p3{background:#eef0f3;color:#555}
h3{margin:0 0 6px;font-size:15px}dl{margin:0;display:grid;grid-template-columns:72px 1fr;gap:3px 8px;font-size:13px}dt{color:var(--sub)}dd{margin:0}
.choice{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.choice label{border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.choice input{margin-right:4px}.choice input:focus-visible+span{outline:2px solid var(--pri)}
.memo{flex:1;min-width:140px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
section.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
section.sum h2{font-size:16px;margin:0 0 8px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:#f0f2f6}
#mdbox{width:100%;height:60vh;font-family:Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:10px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>SmartMail 검토 — 테스트 시나리오 · 개선안 · 업무 지원안</h1>
<p>기준: 업무처리관리현황 기획서 v1.0(2026-11-11), 개발지침서 v1.0, 결정사항(2026-11-13) · 작성일 2026-11-13</p>
</header>
<div class="warn"><b>범위 안내</b> · 사용자 PC의 SmartMail 소스 코드는 이번 검토에서 열람하지 못했습니다(연결 실패). 모든 항목은 <b>기획서 요구사항 기준</b>이며, 각 항목의 ‘코드 대조’는 ‘미실시’로 표시됩니다. 실제 구현 여부는 컴퓨터 연결 후 대조가 필요합니다.</div>

<div class="bar">
  <div class="tabs" id="tabs">
    <button data-t="sum" class="on">요약(5단계)</button>
    <button data-t="TS">테스트 시나리오</button>
    <button data-t="IMP">추가 개선안</button>
    <button data-t="HW">실무 업무 지원안</button>
    <button data-t="MD">MD 생성</button>
  </div>
  <div class="stat" id="stat"></div>
</div>

<main>
  <div id="v-sum"></div>
  <div id="v-list" class="hidden">
    <div class="filters">
      <select id="fArea"></select>
      <select id="fPri"></select>
      <select id="fState"><option value="">상태 전체</option><option value="go">진행</option><option value="hold">보류</option><option value="no">제외</option><option value="none">미결정</option></select>
      <input id="fText" placeholder="검색(ID·제목·요구사항)">
      <button class="btn" id="bulkGo">보이는 항목 모두 ‘진행’</button>
      <button class="btn" id="bulkClear">보이는 항목 선택 해제</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="v-md" class="hidden">
    <div class="filters">
      <button class="btn main" id="mdDl">MD 파일 다운로드</button>
      <button class="btn" id="mdCopy">MD 복사</button>
      <button class="btn" id="stSave">선택 상태 저장(JSON)</button>
      <label class="btn">선택 상태 불러오기<input type="file" id="stLoad" accept=".json" class="hidden"></label>
      <span id="mdMsg" style="color:var(--sub)"></span>
    </div>
    <textarea id="mdbox" readonly aria-label="생성된 MD"></textarea>
  </div>
</main>

function visible(){

function card(i){

    : `<dl><dt>${i.kind==="HW"?"업무 상황":"현황·문제"}</dt><dd>${esc(i.now)}</dd><dt>제안</dt><dd>${esc(i.prop)}</dd><dt>가설·효과</dt><dd>${esc(i.hyp)}</dd><dt>검증</dt><dd>${esc(i.verify)}</dd><dt>근거</dt><dd>${esc(i.ev)} <span class="chip">${esc(i.evType)}</span></dd></dl>`;

    : `<span class="chip">${esc(i.cat)}</span><span class="chip">난이도 ${esc(i.effort)}</span><span class="chip ${({높음:"p1",중간:"p2",낮음:"p3"})[i.pri]}">우선 ${esc(i.pri)}</span>`;
  const r=v=>`<label><input type="radio" name="r-${i.id}" value="${v}" ${s===v?"checked":""}><span>${SL[v]}</span></label>`;

}

  o.push(`## 1. Agenda Framing`,``,`| 구분 | 내용 |`,`|---|---|`,
    `| 목적 | 승인된 테스트·개선·업무 지원 항목을 개발 백로그와 테스트 계획으로 확정 |`,
    `| 범위 | 테스트 시나리오 ${ts.length}건, 추가 개선안 ${im.length}건, 실무 업무 지원안 ${hw.length}건 |`,

  if(!ts.length)o.push(`| (승인된 테스트 없음) | 0 | 0 |`);
  o.push(``,`| 분류 | 승인 개선·지원안 |`,`|---|---|`);
  const cats={};[...im,...hw].forEach(i=>{cats[i.cat]=(cats[i.cat]||[]).concat(i.id)});
  Object.entries(cats).forEach(([c,ids])=>o.push(`| ${md(c)} | ${ids.join(", ")} |`));
  if(!Object.keys(cats).length)o.push(`| (없음) | - |`);
  o.push(``,`## 3. Hypothesis Driven Analysis`,``);
  if(im.length||hw.length){o.push(`| ID | 제안 | 가설·기대효과 | 검증 방법 |`,`|---|---|---|---|`);[...im,...hw].forEach(i=>o.push(`| ${i.id} | ${md(i.title)} | ${md(i.hyp)} | ${md(i.verify)} |`));}
  else o.push(`승인된 개선·지원안이 없습니다.`);
  o.push(``,`> ‘추론’ 근거 항목의 효과는 확정이 아니며 파일럿에서 검증합니다.`,``);
  o.push(`## 4. Evidence Matrix`,``,`| ID | 구분 | 근거 | 근거 유형 | 코드 대조 |`,`|---|---|---|---|---|`);
  go.forEach(i=>o.push(`| ${i.id} | ${KIND[i.kind]} | ${md(i.kind==="TS"?i.req:i.ev)} | ${i.kind==="TS"?(/^[A-Z]+-\d/.test(i.req)?"기획서":"기획서·보안기준"):md(i.evType)} | 미실시 |`));
  if(!go.length)o.push(`| - | - | - | - | - |`);
  o.push(``,`## 5. Executive Structuring`,``,
    `**결론:** 진행 승인 ${go.length}건(테스트 ${ts.length} · 개선 ${im.length} · 업무 지원 ${hw.length})을 확정합니다.`,``,
    `| 순서 | 다음 단계 | 담당(안) |`,`|---|---|---|`,
    `| 1 | 컴퓨터 연결 후 SmartMail 소스와 승인 항목 대조(구현됨/부분/미구현) | 개발 |`,
    `| 2 | 승인 테스트를 tests/에 요구사항 ID 이름으로 작성, Fake 어댑터·합성 데이터만 사용 | 개발 |`,
    `| 3 | 승인 개선·지원안을 docs/결정기록/에 기록하고 기획서 변경이력 갱신 | 기획 |`,
    `| 4 | 보류 ${hold.length}건은 파일럿 2주 후 재검토 | IE팀 |`,``);
  const tbl=(title,list,fn)=>{o.push(title,``);if(!list.length){o.push(`없음`,``);return;}fn(list);o.push(``);};
  o.push(`## 부록 A. 테스트 시나리오 상세`,``);
  Object.keys(AREAS).forEach(a=>{const l=ts.filter(i=>i.area===a);if(!l.length)return;
    o.push(`### ${AREAS[a]}`,``,`| 완료 | ID | 요구사항 | 유형 | 우선 | 시나리오 | 사전조건 | 절차 | 기대결과 | 메모 |`,`|---|---|---|---|---|---|---|---|---|---|`);
    l.forEach(i=>o.push(`| [ ] | ${i.id} | ${md(i.req)} | ${i.type} | ${i.pri} | ${md(i.title)} | ${md(i.pre)} | ${md(i.steps)} | ${md(i.exp)} | ${memo(i)} |`));o.push(``);});
  if(!ts.length)o.push(`없음`,``);
  const det=l=>{o.push(`| 완료 | ID | 분류 | 제목 | 현황·상황 | 제안 | 난이도 | 우선 | 메모 |`,`|---|---|---|---|---|---|---|---|---|`);l.forEach(i=>o.push(`| [ ] | ${i.id} | ${md(i.cat)} | ${md(i.title)} | ${md(i.now)} | ${md(i.prop)} | ${i.effort} | ${i.pri} | ${memo(i)} |`));};
  tbl(`## 부록 B. 추가 개선안 상세`,im,det);
  tbl(`## 부록 C. 실무 업무 지원안 상세`,hw,det);
  if(hold.length){o.push(`## 부록 D. 보류 항목`,``,`| ID | 제목 | 메모 |`,`|---|---|---|`);hold.forEach(i=>o.push(`| ${i.id} | ${md(i.title)} | ${memo(i)} |`));o.push(``);}
  o.push(`---`,`※ 본 자료는 개발 검토 자료이며 법률·보안 준수 판정을 대신하지 않습니다. 개인정보 처리 근거는 법무·개인정보 담당 확인이 필요합니다.`);
  return o.join("\n");
}
function renderMD(){const t=buildMD();$("#mdbox").value=t;$("#mdMsg").textContent=ALL.some(i=>st(i.id)==="go")?"":"‘진행’으로 선택한 항목이 없습니다.";}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);}
$("#mdDl").onclick=()=>download(`SmartMail_검토_승인항목_${today()}.md`,buildMD(),"text/markdown;charset=utf-8");
$("#mdCopy").onclick=async()=>{try{await navigator.clipboard.writeText(buildMD());$("#mdMsg").textContent="복사했습니다."}catch(e){$("#mdbox").select();document.execCommand("copy");$("#mdMsg").textContent="복사했습니다."}};
$("#stSave").onclick=()=>download(`SmartMail_검토_선택상태_${today()}.json`,JSON.stringify({v:1,state:ST},null,1),"application/json");
$("#stLoad").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1e6){alert("파일이 너무 큽니다.");return;}
  f.text().then(t=>{const j=JSON.parse(t);const ids=new Set(ALL.map(i=>i.id));Object.keys(ST).forEach(k=>delete ST[k]);
    Object.entries(j.state||{}).forEach(([k,v])=>{if(ids.has(k)&&v&&["go","hold","no",""].includes(v.s))ST[k]={s:v.s,m:String(v.m||"").slice(0,500)}});
    stats();renderMD();$("#mdMsg").textContent="불러왔습니다.";}).catch(()=>alert("올바른 상태 파일이 아닙니다."));e.target.value="";};

// ── 탭
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("#v-sum").classList.toggle("hidden",tab!=="sum");$("#v-md").classList.toggle("hidden",tab!=="MD");
  $("#v-list").classList.toggle("hidden",!["TS","IMP","HW"].includes(tab));
  if(tab==="sum")renderSum();else if(tab==="MD")renderMD();else{fillFilters();$("#fState").value="";$("#fText").value="";renderList();}});
renderSum();stats();
</script>
